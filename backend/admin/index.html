<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrace | evobeds</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="admin.css?v=5">
</head>
<body>

  <!-- Přihlášení -->
  <div id="prihlaseni" class="login-wrap" hidden>
    <form id="login-form" class="login-card">
      <div class="brand">evobeds <span>administrace</span></div>
      <label>E-mail<input id="login-email" type="email" autocomplete="username" placeholder="jmeno@evobeds.cz"></label>
      <label>Heslo<input id="heslo" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-dark" type="submit">Přihlásit se</button>
      <p class="login-napoveda">Při úplně prvním přihlášení použijte hlavní heslo z nastavení serveru, účet administrátora se založí sám.</p>
      <p id="login-chyba" class="chyba" hidden></p>
    </form>
  </div>

  <!-- Aplikace -->
  <div id="aplikace" hidden>
    <header class="top">
      <div class="brand">evobeds <span>administrace</span></div>
      <!-- Workflow nahoře: kapsle s ikonkou -->
      <nav class="zalozky">
        <button data-pohled="nastenka" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Přehled</span>
        </button>
        <button data-pohled="b2c">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span>Zakázky</span>
        </button>
        <button data-pohled="b2b">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          <span>Obchod</span>
        </button>
        <button data-pohled="reklamace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="12.5"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Reklamace</span>
        </button>
      </nav>
      <div id="tym" class="tym" title="Kliknutím vyfiltrujete zakázky člověka"></div>
      <div class="top-right">
        <input id="hledani" type="search" placeholder="Hledat zakázku či klienta…">
        <button id="nova-zakazka" class="btn btn-dark btn-sm">Nová zakázka</button>
        <button id="odhlasit" class="btn btn-sm" title="Odhlásit se">Odhlásit</button>
      </div>
    </header>

    <!-- Seznamy vlevo: kuličky -->
    <nav class="rail" aria-label="Seznamy">
      <button data-pohled="klienti" title="Klienti">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button data-pohled="uzivatele" data-jen-admin title="Uživatelé">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </nav>

    <main id="obsah"></main>
  </div>

  <!-- Detail zakázky -->
  <div id="detail-pozadi" class="detail-pozadi" hidden></div>
  <aside id="detail" class="detail" hidden></aside>

  <!-- Nová zakázka -->
  <div id="nova-pozadi" class="detail-pozadi" hidden></div>
  <aside id="nova" class="detail" hidden>
    <div class="detail-hlava">
      <h2>Nová zakázka</h2>
      <button class="zavrit" data-zavri-novou aria-label="Zavřít">×</button>
    </div>
    <form id="nova-form" class="detail-telo">
      <div class="pole-rada pole-rada-3">
        <label class="prepinac"><input type="radio" name="typ" value="b2b" checked> Obchod</label>
        <label class="prepinac"><input type="radio" name="typ" value="b2c"> Zakázka</label>
        <label class="prepinac"><input type="radio" name="typ" value="reklamace"> Reklamace</label>
      </div>
      <label>Název zakázky<input name="nazev" placeholder="Např. Domov seniorů Beroun, 12 lůžek" required></label>
      <label>Zodpovídá<select name="prirazeno" id="nova-prirazeno"></select></label>
      <div class="pole-rada">
        <label>Firma / zařízení<input name="firma"></label>
        <label>Kontaktní osoba<input name="jmeno"></label>
      </div>
      <div class="pole-rada">
        <label>Telefon<input name="telefon"></label>
        <label>E-mail<input name="email" type="email"></label>
      </div>
      <label>Adresa<input name="adresa" placeholder="Ulice 1, 110 00 Praha"></label>
      <div class="pole-rada">
        <label>IČ<input name="ic"></label>
        <label>DIČ<input name="dic"></label>
      </div>
      <label>Odhad hodnoty (Kč)<input name="hodnotaKc" type="number" min="0" step="1000"></label>
      <label>Související zakázka (u reklamací)<input name="vazba" list="seznam-zakazek" placeholder="začněte psát jméno, firmu nebo číslo…" autocomplete="off"></label>
      <datalist id="seznam-zakazek"></datalist>
      <p id="vazba-info" class="login-napoveda" hidden></p>
      <label>Poznámka<textarea name="poznamka" rows="3"></textarea></label>
      <button class="btn btn-dark" type="submit">Založit zakázku</button>
      <p id="nova-chyba" class="chyba" hidden></p>
    </form>
  </aside>

  <script src="admin.js?v=5"></script>
</body>
</html>
